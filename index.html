<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Press kits</title><style>body{font:16px/1.5 -apple-system,system-ui,sans-serif;max-width:720px;margin:48px auto;padding:0 16px;color:#1d1d1f;background:#fff}@media(prefers-color-scheme:dark){body{color:#f5f5f7;background:#111}a{color:#64a9f0}}</style></head><body><h1>Press kits</h1><p>Screenshots, facts and dates for apps by Hemal Modi. One folder per app.</p><ul id="l"></ul><script>fetch('apps.json').then(r=>r.json()).then(a=>{document.getElementById('l').innerHTML=a.map(x=>`<li><a href="${x.slug}/">${x.name}</a></li>`).join('')})</script></body></html>
